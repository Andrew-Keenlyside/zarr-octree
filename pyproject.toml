[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-octree"
dynamic = ["version"]
description = "A Zarr v3 sharding codec: a sparse shard index and inner chunks grouped into octree runs"
requires-python = ">=3.11"
dependencies = ["zarr>=3.2", "numpy"]  # the codec builds on zarr 3.2 sharding internals

[project.entry-points."zarr.codecs"]
zarr_octree_sharding = "zarr_octree.codec:OctreeShardingCodec"

[project.optional-dependencies]
test = ["pytest"]
bench = ["matplotlib", "umap-learn", "scikit-learn"]

[tool.setuptools.dynamic]
version = {attr = "zarr_octree.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The data type .* does not have a Zarr V3 specification"]
