[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-octree"
dynamic = ["version"]
description = "A Zarr v3 sharding codec: a sparse shard index and inner chunks grouped into octree runs"
requires-python = ">=3.12"  # zarr 3.2 needs 3.12
dependencies = ["zarr>=3.2", "numpy", "google-crc32c>=1.5"]  # the codec builds on zarr 3.2 sharding internals

[project.entry-points."zarr.codecs"]
octree = "zarr_octree.codec:OctreeShardingCodec"
zarr_octree_sharding = "zarr_octree.codec:OctreeShardingCodec"  # stores written by zarr-octree <= 0.3

[project.optional-dependencies]
test = ["pytest"]
bench = ["matplotlib", "umap-learn", "scikit-learn"]

[tool.setuptools.dynamic]
version = {attr = "zarr_octree.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The data type .* does not have a Zarr V3 specification"]
